name: Build desktop app

# Produces the double-clickable app for people who won't clone a repo.
# Artifacts land on the run page; attach them to a release to hand out a link.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Auto-DM-macos
            path: dist/Auto-DM.app
          - os: windows-latest
            artifact: Auto-DM-windows
            path: dist/Auto-DM
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: pyinstaller --noconfirm desktop/autodm.spec

      # Unsigned builds are quarantined on download. Ad-hoc signing at least
      # keeps macOS from calling the app damaged; the user still has to
      # right-click → Open the first time. Real distribution needs an Apple
      # Developer ID and notarisation — see docs/desktop-app.md.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/Auto-DM.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
