<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Campaign Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header id="header">
    <span class="header-campaign" id="header-campaign"></span>
    <span class="header-divider" id="header-div-1">·</span>
    <span id="header-location"></span>
    <span class="header-flavor">
      <span id="header-date"></span>
      <span class="header-divider" id="header-div-2">·</span>
      <span id="header-weather"></span>
    </span>
    <button id="panels-toggle" title="Sheets, quests & settings" aria-label="Toggle the side panel">🛡</button>
    <button id="settings-btn" title="Table settings" aria-label="Table settings">⚙</button>
  </header>

  <main id="main-grid">

    <!-- LEFT: one panel at a time. Every pane below declares its own tab
         (data-tab); the strip is built from whatever is in the markup, so
         adding a panel is an HTML edit and nothing else. -->
    <section id="panel-column">
      <div id="panel-tabs" role="tablist"></div>
      <div id="panel-panes">

        <section class="panel" data-panel="characters" data-tab="Sheets">
          <div id="char-tabs"></div>
          <div id="characters-inner"></div>
        </section>

        <section class="panel" data-panel="quests" data-tab="Quests">
          <div class="panel-scroll"><ul id="quests-list"></ul></div>
        </section>

        <section class="panel" data-panel="whoswho" data-tab="Who's Who">
          <div class="panel-scroll"><ul id="whoswho-list"></ul></div>
        </section>

        <section class="panel" data-panel="resources" data-tab="Party Pack">
          <div class="panel-scroll"><ul id="resources-list"></ul></div>
        </section>

        <section class="panel" data-panel="settings" data-tab="Settings">
          <div class="panel-scroll">
            <p class="settings-hint">How the DM runs the table. Changes reach the DM on their next narration.</p>

            <label class="setting-row">
              <span class="setting-label">Rules strictness</span>
              <select id="set-rules-strictness">
                <option value="strict">Strict — rules as written, dice fall where they fall</option>
                <option value="flexible">Flexible — DM may soften outcomes (hand of god)</option>
              </select>
            </label>

            <label class="setting-row setting-check">
              <input type="checkbox" id="set-beginner-mode">
              <span><span class="setting-label">Beginner mode</span>
              <span class="setting-desc">DM suggests options and reminds you of your abilities</span></span>
            </label>

            <label class="setting-row setting-check">
              <input type="checkbox" id="set-kid-friendly">
              <span><span class="setting-label">Kid-friendly</span>
              <span class="setting-desc">Keep violence and horror gentle</span></span>
            </label>

            <label class="setting-row">
              <span class="setting-label">Narration style</span>
              <select id="set-narration-style">
                <option value="brief">Brief — outcomes and a scene beat</option>
                <option value="standard">Standard</option>
                <option value="cinematic">Cinematic — rich, longer scenes</option>
              </select>
            </label>

            <label class="setting-row">
              <span class="setting-label">House rules</span>
              <textarea id="set-custom-rules" rows="4"
                placeholder="Free text — the DM treats these as active house rules."></textarea>
            </label>

            <label class="setting-row">
              <span class="setting-label">DM model</span>
              <select id="set-dm-model"></select>
            </label>

            <label class="setting-row setting-check">
              <input type="checkbox" id="set-dev-mode">
              <span><span class="setting-label">Developer mode</span>
              <span class="setting-desc">Pick each role's model and add a Dev Log tab — applies instantly, saved on this device</span></span>
            </label>

            <div class="settings-actions">
              <span id="settings-status"></span>
              <button id="settings-save">Save</button>
            </div>

            <!-- Developer section — shown by the Developer mode toggle above.
                 Per-role model choice; see prompts/README.md. -->
            <section id="dev-section" class="hidden">
              <h2 class="section-label">Developer</h2>
              <div id="dev-body"></div>
            </section>
          </div>
        </section>

        <!-- Dev-mode only: every tool call and result, newest first. The tab
             appears and disappears with the Developer mode toggle. -->
        <section class="panel panel-off" data-panel="devlog" data-tab="Dev Log">
          <div class="panel-scroll"><ul id="devlog-list"></ul></div>
        </section>

      </div>
    </section>

    <!-- CENTER: Narration Feed -->
    <section id="feed-column">
      <div id="feed-header">
        <span class="section-label">Chronicle</span>
      </div>
      <div id="feed-entries"></div>
      <div id="say-thinking" class="hidden"></div>
      <form id="say-form" autocomplete="off">
        <input id="say-text" placeholder="What do you do?" maxlength="2000" required>
        <button id="say-send" type="submit">➤</button>
      </form>
    </section>

  </main>

  <!-- COMBAT BAR — hidden until combat is active -->
  <footer id="combat-bar" class="hidden">
    <span class="combat-label">⚔ Combat</span>
    <span id="combat-round"></span>
    <div id="initiative-track"></div>
  </footer>

  <!-- Character full-sheet modal -->
  <div id="char-modal" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" data-close="char-modal" aria-label="Close">✕</button>
      <div id="char-modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
